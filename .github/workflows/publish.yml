name: Release

# Validate packages and publish the source release. Upload the reviewed dist
# artifacts to PyPI with the package owner's scoped token (see RELEASING.md).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: [pyproject.toml, .github/workflows/publish.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m mypy src

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - name: Verify package and release versions
        run: |
          python -m pip install dist/*.whl
          python - <<'PY'
          import os, tomllib
          import link_console_sdk
          from importlib.metadata import version
          with open('pyproject.toml', 'rb') as f:
              expected = tomllib.load(f)['project']['version']
          assert version('link-console-sdk') == link_console_sdk.__version__ == expected
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + expected
          PY
      # Catches bad metadata before it reaches PyPI, where a version is
      # immutable and cannot be re-uploaded.
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release.sh "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
