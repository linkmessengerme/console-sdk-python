[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "link-console-sdk"
version = "0.2.0"
description = "Official Python SDK for the Link Developer Platform (Console API) — send OTP codes through the Link bot."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Link Messenger", email = "dev@linkmessenger.me" }]
keywords = ["link", "link-messenger", "otp", "2fa", "authentication", "verification", "console", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.5",
    # Metadata 2.4 (PEP 639 License-Expression) needs twine >= 6.1
    "build>=1.2",
    "twine>=6.1",
]

[project.urls]
Homepage = "https://github.com/linkmessengerme/console-sdk-python"
Repository = "https://github.com/linkmessengerme/console-sdk-python"
Issues = "https://github.com/linkmessengerme/console-sdk-python/issues"
Changelog = "https://github.com/linkmessengerme/console-sdk-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/link_console_sdk"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
